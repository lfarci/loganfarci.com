name: One-time static social card commit
on:
  push:
    branches:
      - fix/496-social-canonical-host
    paths:
      - .github/workflows/commit-static-social-card.yml

permissions:
  contents: write

jobs:
  commit-static-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/496-social-canonical-host
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --prefix src
      - run: npm --prefix src run social:generate
      - name: Commit image as static asset
        run: |
          git add -f src/public/images/social-preview.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets(seo): commit social preview as static png"
          git push origin HEAD:refs/heads/fix/496-social-canonical-host
