name: "Deploy App to SWA (reusable)"

on:
  workflow_call:
    inputs:
      github_environment_name:
        required: true
        type: string
        description: "GitHub environment name (e.g., Production or Preview)"
      static_web_app_environment_name:
        required: false
        type: string
        default: ""
        description: "SWA deployment environment name (e.g., pr-123, empty for production)"
      commit_hash:
        required: true
        type: string
        description: "Commit SHA for VITE_COMMIT_HASH"
      repository_url:
        required: true
        type: string
        description: "GitHub repository URL for VITE_GITHUB_REPOSITORY_URL"
    outputs:
      static_web_app_url:
        description: "URL of the deployed Azure Static Web Apps environment"
        value: ${{ jobs.deploy.outputs.static_web_app_url }}
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_KEY_VAULT_NAME:
        required: true

jobs:
  deploy:
    name: "Deploy App"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.github_environment_name }}
    outputs:
      static_web_app_url: ${{ steps.deploy.outputs.static_web_app_url }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            ${{ github.workspace }}/src/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm clean-install

      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get secrets from Key Vault
        id: get-secrets
        env:
          AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        run: |
          echo "deployment_token=$(az keyvault secret show --name StaticWebAppDeploymentKey --vault-name "$AZURE_KEY_VAULT_NAME" --query value -o tsv)" >> $GITHUB_OUTPUT
          echo "application_insights_connection_string=$(az keyvault secret show --name ApplicationInsightsConnectionString --vault-name "$AZURE_KEY_VAULT_NAME" --query value -o tsv 2>/dev/null || echo "")" >> $GITHUB_OUTPUT

      # Azure SWA PR previews have a different hostname than the custom production
      # domain. The social image must point to the preview's own deployed PNG.
      - name: Resolve preview social image origin
        id: preview-image
        if: inputs.static_web_app_environment_name != ''
        env:
          PREVIEW_ENVIRONMENT: "${{ inputs.static_web_app_environment_name }}"
        run: |
          # Discover the currently deployed site instead of assuming Terraform's
          # default resource-group/name values match every Azure environment.
          default_hostname=$(az staticwebapp list \
            --query "[?contains(to_string(customDomains), 'www.loganfarci.com')].defaultHostname | [0]" \
            -o tsv)
          app_region=$(az staticwebapp list \
            --query "[?contains(to_string(customDomains), 'www.loganfarci.com')].location | [0]" \
            -o tsv)

          if [[ ! "$default_hostname" == *.azurestaticapps.net || -z "$app_region" ]]; then
            echo "::error::Could not determine the Azure Static Web App hostname and region"
            exit 1
          fi

          # Azure's default hostname can omit the region included in preview URLs.
          # For example, production '<name>.2.azurestaticapps.net' becomes
          # '<name>-497.westeurope.2.azurestaticapps.net' for PR #497.
          app_region="${app_region// /}"
          app_region="${app_region,,}"
          suffix="${PREVIEW_ENVIRONMENT#pr-}"
          domain_suffix="${default_hostname#*.}"
          if [[ "$domain_suffix" != "$app_region".* ]]; then
            domain_suffix="$app_region.$domain_suffix"
          fi
          preview_hostname="${default_hostname%%.*}-${suffix}.${domain_suffix}"
          echo "origin=https://${preview_hostname}" >> "$GITHUB_OUTPUT"

      - name: Build application
        run: npm run build
        env:
          VITE_GITHUB_REPOSITORY_URL: "${{ inputs.repository_url }}"
          VITE_COMMIT_HASH: "${{ inputs.commit_hash }}"
          VITE_APPINSIGHTS_CONNECTION_STRING: "${{ steps.get-secrets.outputs.application_insights_connection_string }}"
          VITE_DEPLOYMENT_ENVIRONMENT: "${{ inputs.github_environment_name }}"
          VITE_OG_IMAGE_ORIGIN: "${{ steps.preview-image.outputs.origin }}"

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-secrets.outputs.deployment_token }}
          action: upload
          app_location: src/dist
          output_location: ""
          skip_app_build: true
          deployment_environment: ${{ inputs.static_web_app_environment_name }}
