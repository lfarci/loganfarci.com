name: One-time native 2x social preview
on:
  push:
    branches:
      - fix/496-social-canonical-host
    paths:
      - .github/workflows/one-time-social-2x.yml

permissions:
  contents: write

jobs:
  commit-higher-resolution-static-png:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/496-social-canonical-host
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --prefix src
      - name: Install Chromium
        working-directory: src
        run: npx playwright install --with-deps chromium
      - name: Render with actual fonts at 2x resolution
        working-directory: src
        run: node .tmp/render-social-card-2x.mjs
      - name: Commit static image only and remove temporary tooling
        run: |
          git add -f src/public/images/social-preview.png
          rm src/.tmp/render-social-card-2x.mjs .github/workflows/one-time-social-2x.yml
          git add -u
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets(seo): render sharper 2x static social preview"
          git push origin HEAD:refs/heads/fix/496-social-canonical-host
