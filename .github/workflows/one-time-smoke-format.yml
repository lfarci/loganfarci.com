name: One-time smoke formatting
on:
  push:
    branches:
      - fix/496-social-canonical-host
    paths:
      - .github/workflows/one-time-smoke-format.yml

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/496-social-canonical-host
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --prefix src
      - name: Format smoke test with repository's Prettier
        working-directory: src
        run: |
          npx prettier --write scripts/smoke.mjs --ignore-path ../.prettierignore
          npx prettier --check scripts/smoke.mjs --ignore-path ../.prettierignore
          node --check scripts/smoke.mjs
      - name: Commit format and remove one-time workflow
        run: |
          rm .github/workflows/one-time-smoke-format.yml
          git add src/scripts/smoke.mjs
          git add -u
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: format all-page social preview smoke checks"
          git push origin HEAD:refs/heads/fix/496-social-canonical-host
