name: Pull Request Title Convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate Pull Request Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            style
            perf
            revert
          subjectPattern: ^[a-z].*\S$
          subjectPatternError: |
            The subject must start with a lowercase letter and contain at least one non-whitespace character.
            Found: "{subject}"
          validateSingleCommit: false
