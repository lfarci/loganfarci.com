name: PR Title Convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            style
            perf
            revert
          subjectPattern: ^.+$
          subjectPatternError: |
            The subject (text after the colon) must not be empty.
            Found: "{subject}"
          validateSingleCommit: false
