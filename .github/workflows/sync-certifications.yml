name: Sync Certifications

on:
    workflow_dispatch:
    schedule:
        - cron: "0 6 1 * *"

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: certification-sync
    cancel-in-progress: false

env:
    AUTOMATION_BRANCH: auto/synchronize-certifications-${{ github.run_id }}
    PR_BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
    sync:
        name: Refresh generated certification data
        if: github.event_name == 'workflow_dispatch' || vars.CERTIFICATION_SYNC_SCHEDULE_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.PR_BASE_BRANCH }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: src/package-lock.json

            - name: Install dependencies
              working-directory: src
              run: npm ci

            - name: Prepare automation branch
              run: |
                  git fetch origin "+refs/heads/$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH" || true
                  git switch -C "$AUTOMATION_BRANCH" "origin/$PR_BASE_BRANCH"

            - name: Run certification sync
              working-directory: src
              run: npm run sync:certifications

            - name: Verify generated file scope
              id: generated
              run: |
                  set -euo pipefail

                  changed_paths="$(
                    {
                      git diff --name-only
                      git ls-files --others --exclude-standard
                    } | sort -u
                  )"

                  if [ -z "$changed_paths" ]; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "No generated certification changes detected." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi

                  while IFS= read -r path; do
                    case "$path" in
                      content/data/certifications.json|src/public/images/certifications/*.avif)
                        ;;
                      *)
                        echo "::error file=$path::Certification sync produced an out-of-scope change."
                        exit 1
                        ;;
                    esac
                  done <<< "$changed_paths"

                  {
                    echo "changed=true"
                    echo "paths<<EOF"
                    echo "$changed_paths"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

                  {
                    echo "Generated certification changes:"
                    echo
                    echo '```'
                    echo "$changed_paths"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Commit generated changes
              if: steps.generated.outputs.changed == 'true'
              run: |
                  set -euo pipefail

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add content/data/certifications.json src/public/images/certifications
                  git commit -m "chore: sync certifications"

            - name: Push automation branch
              if: steps.generated.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh auth setup-git
                  git push --force-with-lease origin "$AUTOMATION_BRANCH"

            - name: Create or update pull request
              if: steps.generated.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  body_file="$(mktemp)"
                  cat > "$body_file" <<'EOF'
                  ## Summary

                  - refreshes generated certification data and badge assets from public profile sources
                  - updates only `content/data/certifications.json` and `src/public/images/certifications/*.avif`

                  ## Validation

                  - `npm run sync:certifications`

                  Generated by the monthly/manual certification synchronization workflow.
                  EOF

                  pr_number="$(gh pr list \
                    --base "$PR_BASE_BRANCH" \
                    --head "$AUTOMATION_BRANCH" \
                    --state open \
                    --json number \
                    --jq '.[0].number // empty')"

                  if [ -n "$pr_number" ]; then
                    gh pr edit "$pr_number" \
                      --title "chore: sync certifications" \
                      --body-file "$body_file"
                    echo "Updated certification sync pull request #$pr_number." >> "$GITHUB_STEP_SUMMARY"
                  else
                    pr_url="$(gh pr create \
                      --base "$PR_BASE_BRANCH" \
                      --head "$AUTOMATION_BRANCH" \
                      --title "chore: sync certifications" \
                      --body-file "$body_file")"
                    echo "Created certification sync pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
                  fi
