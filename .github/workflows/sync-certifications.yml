name: Sync Certifications

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync certifications
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync certifications
        env:
          MICROSOFT_LEARN_CREDENTIAL_URLS: ${{ vars.MICROSOFT_LEARN_CREDENTIAL_URLS }}
          CREDLY_BADGE_URLS: ${{ vars.CREDLY_BADGE_URLS }}
        run: npm run sync:certifications

      - name: Check for changes
        id: changes
        run: |
          git add \
            ../content/data/certifications.json \
            public/images/certifications/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/sync-certifications-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: sync certifications $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync certifications $(date +%Y-%m-%d)" \
            --body "Automated monthly certification sync. Triggered by schedule or manual dispatch." \
            --base main \
            --head "$BRANCH"
