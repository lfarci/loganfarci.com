name: One-time homepage social card
on:
  push:
    branches:
      - fix/496-social-canonical-host
    paths:
      - .github/workflows/one-time-homepage-preview.yml

permissions:
  contents: write

jobs:
  commit-homepage-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/496-social-canonical-host
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --prefix src
      - name: Install Chromium
        working-directory: src
        run: npx playwright install --with-deps chromium
      - name: Render exact homepage headline in site fonts
        working-directory: src
        run: node .tmp/render-social-v3.mjs
      - name: Commit only static PNG and remove one-time tooling
        run: |
          git add -f src/public/images/social-preview-v3.png
          git rm src/public/images/social-preview-v2.png
          rm src/.tmp/render-social-v3.mjs .github/workflows/one-time-homepage-preview.yml
          git add -u
          git -c user.name="github-actions[bot]" -c user.email="41898282+lfarci@users.noreply.github.com" commit -m "assets(seo): use smaller homepage-matched static social card"
          git push origin HEAD:refs/heads/fix/496-social-canonical-host
