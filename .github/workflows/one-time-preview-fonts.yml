name: One-time font-matched static preview
on:
  push:
    branches:
      - fix/496-social-canonical-host
    paths:
      - .github/workflows/one-time-preview-fonts.yml

permissions:
  contents: write

jobs:
  update-static-png:
    name: Commit PNG rendered with website fonts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/496-social-canonical-host
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --prefix src
      - name: Install Chromium
        working-directory: src
        run: npx playwright install --with-deps chromium
      - name: Render social preview with self-hosted fonts
        working-directory: src
        run: node .tmp/render-social-font-match.mjs
      - name: Commit PNG and remove temporary renderer
        run: |
          git add -f src/public/images/social-preview.png
          rm src/.tmp/render-social-font-match.mjs .github/workflows/one-time-preview-fonts.yml
          git add -u
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets(seo): render static social card in website fonts"
          git push origin HEAD:refs/heads/fix/496-social-canonical-host
