name: Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/src/**"
      - "src/tests/unit/**"
      - "src/plugins/**"
      - "src/scripts/**"
      - "src/vite.config.ts"
      - "src/package.json"
      - "src/package-lock.json"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "src/src/**"
      - "src/tests/unit/**"
      - "src/plugins/**"
      - "src/scripts/**"
      - "src/vite.config.ts"
      - "src/package.json"
      - "src/package-lock.json"
      - ".github/workflows/unit-tests.yml"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: test
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee /tmp/test-output.txt

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "All tests passed with sufficient coverage." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tests failed or coverage is below the configured threshold." >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Test &amp; coverage output</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "<pre>" >> "$GITHUB_STEP_SUMMARY"
            [ -f /tmp/test-output.txt ] && sed -e 's/\x1B\[[0-9;]*[a-zA-Z]//g' -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' /tmp/test-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo "</pre></details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: src/coverage
          if-no-files-found: error
