name: Playwright

on:
  workflow_call:
    inputs:
      base_url:
        description: "Deployed or locally reachable app URL to test"
        required: true
        type: string
      artifact_suffix:
        description: "Suffix used to distinguish failure artifacts"
        required: false
        default: preview
        type: string
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed app URL to test"
        required: true
        type: string
      artifact_suffix:
        description: "Suffix used to distinguish failure artifacts"
        required: false
        default: manual
        type: string

jobs:
  acceptance:
    name: Run browser acceptance tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.artifact_suffix }}
          path: |
            src/playwright-report
            src/test-results
          if-no-files-found: warn
          retention-days: 7
