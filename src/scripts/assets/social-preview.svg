    <circle cx="0" cy="-113" r="10" fill="#42b9ae"/>
    <circle cx="0" cy="113" r="10" fill="#4889db"/>
    <circle cx="-113" cy="-110" r="8" fill="#b8d8ed" stroke="#6699c5" stroke-width="2"/>
