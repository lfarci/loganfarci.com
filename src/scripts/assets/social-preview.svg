  <g transform="translate(1011 306)">
    <circle r="165" fill="none" stroke="#c1d6ec" stroke-width="2"/>
    <circle r="113" fill="none" stroke="#83a7c9" stroke-width="2" stroke-dasharray="6 11"/>
    <circle r="66" fill="#e9f3ff" stroke="#5c92d5" stroke-width="2"/>
    <path d="M -113 0 L -67 0 M 67 0 L 113 0 M 0 -113 L 0 -67 M 0 67 L 0 113" stroke="#3e83c3" stroke-width="3"/>
    <path d="M -54 -54 L -112 -110 M 54 54 L 113 110 M 54 -54 L 113 -110 M -54 54 L -113 110" stroke="#89b3d7" stroke-width="2"/>
    <circle cx="-113" cy="0" r="10" fill="#4889db"/>
